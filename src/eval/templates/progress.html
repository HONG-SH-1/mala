<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-__STYLE_HASH__'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
__REFRESH__<title>__TITLE__</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6a6a64; --line: #d9d9d2;
  --accent: #1f5fbf; --pass: #1a7f45; --fail: #b3261e; --hold: #8a6100; --warn-bg: #fff4d6; --ok-bg: #e3f4ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #222427; --text: #ececea; --muted: #a2a29a; --line: #3a3d41;
    --accent: #7aa7ff; --pass: #5ccf8b; --fail: #ff8a80; --hold: #e6b84a; --warn-bg: #3a3118; --ok-bg: #1d3326;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 14px 16px 28px; }
.stamp { font-size: 26px; font-weight: 700; line-height: 1.3; }
.stamp small { font-size: 14px; font-weight: 400; color: var(--muted); margin-right: 8px; }
.note { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; }
.badge { display: inline-block; font-weight: 700; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin-right: 8px; }
.badge.running { background: var(--warn-bg); }
.badge.done { background: var(--ok-bg); }
.summary { font-size: 17px; margin: 0 0 6px; }
progress { width: 100%; height: 16px; }
h2 { font-size: 14px; margin: 0 0 4px; color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 8px 3px 0; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.pass { color: var(--pass); } .fail { color: var(--fail); } .hold { color: var(--hold); } .muted { color: var(--muted); }
.links a { color: var(--accent); margin-right: 14px; font-weight: 600; }
.foot { color: var(--muted); font-size: 12px; }
.nav { font-size: 14px; margin: 0 0 10px; }
.nav a, .nav b, .nav span { margin-right: 16px; }
.nav a { color: var(--accent); font-weight: 600; }
.nav .off { color: var(--muted); }
.md h1 { font-size: 20px; margin: 0 0 8px; }
.md h2 { font-size: 16px; color: var(--accent); margin: 16px 0 4px; }
.md h3 { font-size: 14px; margin: 10px 0 2px; }
.md p { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
.md .li { margin: 1px 0; white-space: pre-wrap; word-break: break-word; }
.md .d1 { margin-left: 1.2em; } .md .d2 { margin-left: 2.4em; } .md .d3 { margin-left: 3.6em; }
.md .gap { height: 0.4em; }
.md code, .md pre { font: 13px/1.5 ui-monospace, Consolas, monospace; background: var(--bg); border-radius: 4px; padding: 0 4px; }
.md pre { white-space: pre-wrap; padding: 8px 10px; border: 1px solid var(--line); }
.md .quote { color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 4px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); }
.tablewrap { overflow-x: auto; margin: 6px 0; }
.md table th, .md table td { padding: 3px 12px 3px 4px; }
</style>
</head>
<body>
<main>
__BODY__
</main>
</body>
</html>
